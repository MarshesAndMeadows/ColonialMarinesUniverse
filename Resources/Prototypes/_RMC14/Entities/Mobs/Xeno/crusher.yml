- type: entity
  abstract: true
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: CMXenoCrusherBase
  name: Crusher
  description: A huge alien with an enormous armored crest.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCrusher
  - type: GhostRole
    name: cm-job-name-xeno-crusher
  - type: Sprite
    sprite: _AU14/Mobs/Xenos/Crusher/crusher.rsi # AU14-Edit
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Critical
      900: Dead
  - type: Xeno
    role: CMXenoCrusher
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoDevolve
    tier: 3
    hudOffset: -0.15,0.1
    unlockAt: 900 # 15 minutes
  - type: XenoRegen
    standHealingMultiplier: 0.66
  - type: XenoHeavy
  - type: XenoDevolve
    devolvesTo:
    - CMXenoWarrior
  - type: XenoDevour
  - type: XenoAnimateMovement
  - type: XenoPlasma
    plasma: 500
    maxPlasma: 500
    plasmaRegenOnWeeds: 4
  - type: CMArmor
    xenoArmor: 40
    explosionArmor: 100
  - type: XenoClaws
    clawType: VerySharp
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 40
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 48
  - type: XenoMeleeSlow
    slowTime: 2
  - type: Tackle
    chance: 0.25
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.66
    baseSprintSpeed: 3
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.68
      whitelist:
        components:
        - Marine
    - multiplier: 0.755
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.5275
      whitelist:
        components:
        - XenoHeavy
  - type: XenoBrutalize
    damage:
      types:
        Blunt: 16
  - type: RMCSize
    size: Immobile
  - type: RMCXenoDamageVisuals
    prefix: crusher
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: crusher
  - type: StunOnExplosionReceived
    weak: false
  - type: IntelRecoverCorpseObjectiveOnDeath
    value: 0.7
  - type: TantrumSpeedBuff
  - type: FixedIdentity
    name: cm-job-name-xeno-crusher
  - type: RMCSurgeryXenoHeart
    item: RMCOrganXenoHeartT3

- type: entity
  parent: CMXenoCrusherBase
  id: RMCXenoCrusher
  components:
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoCrusherFling
    - ActionXenoCrusherTrample
    - ActionXenoCrusherHarden
    - ActionXenoCrusherCrush
    - ActionXenoDevolve
  - type: XenoCrusherFling
    throwStrength: 9.0
    throwRange: 7
    landingStunTime: 0.8
    landingDamage:
      types:
        Blunt: 15
  - type: XenoCrusherTrample
    coneAngle: 110
    coneRange: 2.5
    damage:
      types:
        Blunt: 35
    slowTime: 2.5
    knockdownChance: 0.30
    knockdownTime: 0.6
    cooldownReductionPerHit: 1.5
  - type: XenoCrusherHarden
    shieldMax: 200
    shieldRegenRate: 12
    plasmaDrainRate: 8
    gracePeriod: 1.5
    gracePeriodLocked: true
  - type: XenoCrusherCrush
    doAfterTime: 2.0
    debrisSpeed: 14.0
    debrisRange: 9
    debrisDamage:
      types:
        Blunt: 60
        Structural: 400
    debrisEntity: RMCCrusherDebrisPile
  - type: XenoEvolution
    strains:
    - RMCXenoCrusherCharger
  - type: RMCActionOrder
    id: RMCXenoCrusher

- type: entity
  id: RMCCrusherDebrisPile
  name: crushed wreckage
  description: Twisted metal and broken material flung by a Crusher.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Structures/debris.rsi
    state: crusher_debris
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Clickable
  - type: InteractionOutline

- type: entity
  parent: CMXenoCrusherBase
  id: RMCXenoCrusherCharger
  suffix: Charger
  components:
  - type: Sprite
    sprite: _AU14/Mobs/Xenos/Crusher/charger_crusher.rsi # AU14-Edit
  - type: MobThresholds
    thresholds:
      0: Alive
      780: Critical
      880: Dead
  - type: Xeno
    ignorePheromones: Frenzy
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoToggleCharging
    - ActionXenoStomp
    - ActionXenoTumble
    - ActionXenoRam
    - ActionXenoDevolve
  - type: CMArmor
    xenoArmor: 20
    frontalArmor: 30
    sideArmor: 15
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 30
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 36
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.9
    baseSprintSpeed: 3.4
  - type: XenoStrain
    name: rmc-xeno-charger-name
    description: rmc-xeno-charger-description
    popup: rmc-xeno-charger-popup
  - type: CombatMode
    toggleMouseRotator: false
  - type: XenoTumble
    damage:
      types:
        Blunt: 15
  - type: XenoFling
    paralyzeTime: 0
    slowTime: 8
  - type: XenoStomp # TODO RMC14 screen shake?
    plasmaCost: 25
    paralyzeUnderOnly: true
    range: 3.95
    damage:
      types:
        Blunt: 75
  - type: XenoToggleCharging
  - type: XenoHidden
  - type: RMCActionOrder
    id: RMCXenoCrusherCharger
